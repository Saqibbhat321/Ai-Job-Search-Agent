version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: job_agent_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: saqib
      POSTGRES_DB: job_agent_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:

    build: .

    container_name: ai_job_agent

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    env_file:
      - .env

volumes:
  postgres_data: